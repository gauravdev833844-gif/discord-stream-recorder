name: Record Floxi Discord Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '15 15,19,23 * * *'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Xvfb, PulseAudio, FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio ffmpeg jq curl
          pip install playwright
          playwright install --with-deps chromium

      - name: Start Virtual Display & PulseAudio DiscordSink
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=DiscordSink sink_properties=device.description="DiscordSink" || true
          pactl set-default-sink DiscordSink || true
          pactl set-default-source DiscordSink.monitor || true
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2

      - name: Run Autonomous Discord Recorder
        env:
          DISPLAY: :99
          PULSE_SINK: DiscordSink
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MAX_RUNTIME_SECONDS: "13500"
        run: |
          python -u recorder.py

      - name: Remux All Recorded Segments for Fast Web Seeking
        if: always()
        run: |
          mkdir -p final_recordings
          shopt -s nullglob
          for raw in recordings/Floxi_Raw_*.mp4; do
            base=$(basename "$raw" | sed 's/Floxi_Raw_/Floxi_Indori_Live_/')
            out="final_recordings/$base"
            echo "Remuxing $raw -> $out ..."
            ffmpeg -y -i "$raw" -c copy -movflags +faststart "$out" || cp "$raw" "$out"
            rm -f "$raw"
          done
          ls -lh final_recordings/ || true

      - name: Upload Recordings to Gofile Relay
        if: always()
        run: |
          shopt -s nullglob
          for mp4 in final_recordings/*.mp4; do
            echo "Uploading $mp4 to Gofile..."
            RESPONSE=$(curl -s -F "file=@${mp4}" "https://upload.gofile.io/uploadfile")
            DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
            if [ -z "$DOWNLOAD_LINK" ]; then
              SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty')
              if [ -n "$SERVER" ]; then
                RESPONSE=$(curl -s -F "file=@${mp4}" "https://${SERVER}.gofile.io/contents/uploadfile")
                DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
              fi
            fi
            echo "=========================================="
            echo "File: $(basename "$mp4")"
            echo "Gofile Download URL: ${DOWNLOAD_LINK:-UPLOAD_FAILED}"
            echo "=========================================="
          done

      - name: Upload Screenshots & Recording Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floxi-discord-recording-${{ github.run_id }}
          path: |
            final_recordings/*.mp4
            screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
